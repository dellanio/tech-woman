# Tech Woman only. Goes into the http context (for example /etc/nginx/conf.d/tech-woman-redact-http.conf).
# Defines names that only the Tech Woman vhost uses; no other virtual host or log format is touched.
# Operator: run `nginx -t` first and reload only if it passes. Never restart the shared nginx.

# What the access log may show of $request_uri: the route, never a token (path segment or query).
# First matching expression wins; `default` keeps ordinary requests untouched.
map $request_uri $tw_uri_redacted {
    ~^(?<tw_p>/api/(?:state|choice)/)         "${tw_p}[redacted]";
    ~^(?<tw_p>/inscricao/estado/)             "${tw_p}[redacted]";
    ~^(?<tw_p>/api/v1/auth/password/reset)    "${tw_p}/[redacted]";
    ~*^(?<tw_p>[^?]*)\?(?:.*&)?token=         "${tw_p}?[redacted]";
    default                                   $request_uri;
}

# No referer, no raw URI, no query string: only the redacted form.
log_format tw_redacted '$remote_addr - $remote_user [$time_local] "$request_method $tw_uri_redacted $server_protocol" $status $body_bytes_sent "-" "$http_user_agent"';
