# Tech Woman only. Include INSIDE the server { } block of tech-woman.dellanio.com, for example:
#   include /etc/nginx/snippets/tech-woman-redact-server.conf;
# Never include it in another virtual host. Validate with `nginx -t` before any reload.
access_log /var/log/nginx/tech-woman.access.log tw_redacted;
error_log /var/log/nginx/tech-woman.error.log crit;

# Token-bearing routes: errors are not logged at all (a request line can appear in error-level messages) and
# the access log keeps the redacted form. tech-woman-proxy.conf is the vhost's existing proxy_pass settings.
location ~ ^/(?:api/(?:state|choice)/|inscricao/estado/|api/v1/auth/password/reset) {
    access_log /var/log/nginx/tech-woman.access.log tw_redacted;
    error_log /dev/null crit;
    include /etc/nginx/snippets/tech-woman-proxy.conf;
}
